name: Validate WebUI and server
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # finplan_plan is what the browser runs (spec 19): it and the engine must
      # build for wasm, and the plan crate must not pick up server dependencies.
      - name: Plan crate builds for wasm32 without server dependencies
        run: |
          cargo build -p finplan_core -p finplan_plan --no-default-features --target wasm32-unknown-unknown
          ! cargo tree -p finplan_plan --no-default-features -e normal | grep -E "sqlx|tokio|axum|hyper|reqwest"
      - run: ./scripts/gen-bindings.sh
      - run: git diff --exit-code -- web/lib/api/generated
      # The browser engine (spec 19): the web build and its tests load the
      # WebAssembly that scripts/build-wasm.sh produces, so build it first. The
      # wasm-bindgen CLI is pinned to the version finplan_wasm depends on and
      # cached (a cold install compiles it for a few minutes).
      - name: Read the pinned wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' crates/finplan_wasm/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Cache wasm-bindgen-cli
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.wasm-bindgen.outputs.version }}
      - name: Install wasm-bindgen-cli
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version '=${{ steps.wasm-bindgen.outputs.version }}' --locked
      # wasm-opt shrinks the module; build-wasm.sh warns and goes on without it.
      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen
      - run: cargo clippy -p finplan_wasm --target wasm32-unknown-unknown -- -D warnings
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm wasm
        working-directory: web
      - run: pnpm typecheck && pnpm lint && pnpm test
        working-directory: web
        env:
          # A missing engine build fails the smoke test instead of skipping it.
          FINPLAN_REQUIRE_WASM: "1"
      # The engine was just built; `pnpm build` need not rebuild it.
      - run: pnpm build
        working-directory: web
        env:
          FINPLAN_WASM_PREBUILT: "1"
      - run: python3 -m unittest discover -s scripts -p 'test_sqlite_backup.py'
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build deployable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/beta/Dockerfile.${{ matrix.service }}
          push: false
          load: true
          tags: finplan-${{ matrix.service }}:test
          cache-from: type=gha,scope=beta-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=beta-${{ matrix.service }}
      - name: Smoke test image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if [ "$SERVICE" = server ]; then
            docker run -d --name finplan-test \
              -e FINPLAN_HOSTED=true -e FINPLAN_ACCESS_MODE=beta \
              -e FINPLAN_SECURE_COOKIES=true \
              -e FINPLAN_CORS_ORIGINS=https://beta.example.com \
              -e FINPLAN_REGISTRATION_OPEN=false \
              "finplan-$SERVICE:test"
          else
            docker run -d --name finplan-test "finplan-$SERVICE:test"
          fi
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' finplan-test)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 2
          done
          docker logs finplan-test
          exit 1

name: Validate WebUI and server
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./scripts/gen-bindings.sh
      - run: git diff --exit-code -- web/lib/api/generated
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
        working-directory: web
      - run: python3 -m unittest discover -s scripts -p 'test_sqlite_backup.py'
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build deployable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/beta/Dockerfile.${{ matrix.service }}
          push: false
          load: true
          tags: finplan-${{ matrix.service }}:test
          cache-from: type=gha,scope=beta-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=beta-${{ matrix.service }}
      - name: Smoke test image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if [ "$SERVICE" = server ]; then
            docker run -d --name finplan-test \
              -e FINPLAN_HOSTED=true -e FINPLAN_ACCESS_MODE=beta \
              -e FINPLAN_SECURE_COOKIES=true \
              -e FINPLAN_CORS_ORIGINS=https://beta.example.com \
              -e FINPLAN_REGISTRATION_OPEN=false \
              "finplan-$SERVICE:test"
          else
            docker run -d --name finplan-test "finplan-$SERVICE:test"
          fi
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' finplan-test)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 2
          done
          docker logs finplan-test
          exit 1

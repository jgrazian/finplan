[package]
name = "finplan_server"
version = "0.13.1"
edition = "2024"

[[bin]]
name = "finplan-server"
path = "src/main.rs"

[dependencies]
finplan_core = { path = "../finplan_core" }
finplan_plan = { path = "../finplan_plan", features = ["sqlx"] }

jiff = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }

axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
argon2 = "0.5"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4"] }
serde_json = { version = "1", features = ["raw_value"] }
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus-client = "0.24"
base64ct = { version = "1", features = ["alloc"] }
sha2 = "0.10"
# `deserialize_with` fields (the PATCH double-options) spell their TS shape
# with `#[ts(...)]`, so ts-rs ignoring that serde attribute is expected.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
# Review notes through OpenRouter (suggest::ai), the only model provider.
# openrouter-rs speaks reqwest 0.12 + rustls, the same TLS stack lettre pulls
# in; reqwest is named directly only to hand it a client with our timeout.
openrouter-rs = "0.16"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Text layers of PDF uploads (documents::pdf); nothing else of the crate is used.
lopdf = { version = "0.45", default-features = false }
regex = "1"

[features]
# Pretty-prints the generated TypeScript. Only wanted while regenerating the
# bindings, so it stays off the default build: `format` drags in dprint.
ts-format = ["ts-rs/format", "finplan_plan/ts-format"]

[dev-dependencies]
tempfile = "3"

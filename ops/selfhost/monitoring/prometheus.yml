# /etc/prometheus/prometheus.yml. Everything scraped here listens on loopback.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: finplan
    static_configs:
      - targets: ["127.0.0.1:9480"] # FINPLAN_METRICS_BIND in server.env

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

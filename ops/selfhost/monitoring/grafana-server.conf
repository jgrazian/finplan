# /etc/systemd/system/grafana-server.service.d/finplan.conf
# Settings live here rather than in the package-owned grafana.ini, which an
# upgrade may replace. GF_<SECTION>_<KEY> overrides the ini value.
[Service]
Environment=GF_SERVER_HTTP_ADDR=0.0.0.0
Environment=GF_SERVER_HTTP_PORT=3000
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_AUTH_ANONYMOUS_ENABLED=false
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
Environment=GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/finplan.json
# Holds GF_SECURITY_ADMIN_PASSWORD (root:grafana 0640).
EnvironmentFile=/etc/grafana/finplan.env

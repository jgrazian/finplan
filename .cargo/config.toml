# ts-rs reads these when the `export_bindings_*` tests run. Every `cargo test`
# runs those tests, and without the `ts-format` feature they write unformatted
# TypeScript, so the default export directory is a scratch one under `target/`
# rather than the committed `web/lib/api/generated/`. Only
# `scripts/gen-bindings.sh` writes there: it sets TS_RS_EXPORT_DIR itself, and a
# variable already in the environment wins over this table (no `force`).
#
# `TS_RS_LARGE_INT = number` matters: serde emits `i64` as a JSON number and
# `JSON.parse` hands back a `number`, so the default `bigint` binding would be
# a lie for every row id in the API.
[env]
TS_RS_EXPORT_DIR = { value = "target/ts-bindings", relative = true }
TS_RS_LARGE_INT = "number"
